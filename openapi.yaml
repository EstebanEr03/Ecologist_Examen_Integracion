openapi: 3.0.3
info:
  title: EcoLogistics API
  description: |
    API REST para gestión de envíos - EcoLogistics S.A.
    
    Solución de integración funcional que:
    1. Lee datos de archivo local envios.csv (patrón File Transfer)
    2. Transforma los datos a formato JSON estandarizado
    3. Expone API RESTful documentada con OpenAPI
    4. Demuestra transición de enfoque clásico a modelo moderno
    
    Especificación técnica implementada según contrato de entrega.
    Estructura JSON estandarizada: {id, cliente, direccion, estado}
    
  version: 1.0.0
  contact:
    name: EcoLogistics S.A. - Gerencia de TI
    email: ti@ecologistics.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo local según especificación

paths:
  /envios:
    get:
      summary: Lista todos los envíos
      description: |
        Obtiene la lista completa de envíos cargados desde el archivo CSV.
        Los datos son transformados desde el formato CSV a JSON estandarizado.
      tags:
        - Envíos
      responses:
        '200':
          description: Lista de envíos obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EnvioSpec'
              example:
                - id: "001"
                  cliente: "Juan Pérez"
                  direccion: "Calle 12 #45"
                  estado: "Entregado"
                - id: "002"
                  cliente: "María Gómez"
                  direccion: "Avenida 10 #33"
                  estado: "En tránsito"
                - id: "003"
                  cliente: "Luis Mora"
                  direccion: "Carrera 8 #22"
                  estado: "Pendiente"
        '500':
          description: Error interno del servidor
          
    post:
      summary: Registra un nuevo envío
      description: |
        Registra un nuevo envío en el sistema.
        Los datos se almacenan en memoria (estructura temporal).
        El ID se genera automáticamente si no se proporciona.
      tags:
        - Envíos
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnvioSpecRequest'
            example:
              cliente: "Carlos López"
              direccion: "Carrera 15 #88"
              estado: "Pendiente"
      responses:
        '201':
          description: Envío registrado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioSpec'
              example:
                id: "004"
                cliente: "Carlos López"
                direccion: "Carrera 15 #88"
                estado: "Pendiente"
        '400':
          description: Datos de entrada inválidos
        '500':
          description: Error interno del servidor

  /envios/{id}:
    get:
      summary: Obtiene un envío específico
      description: |
        Obtiene los detalles de un envío específico por su ID.
        Busca en los datos cargados en memoria desde el archivo CSV.
      tags:
        - Envíos
      parameters:
        - name: id
          in: path
          required: true
          description: ID único del envío (formato: 001, 002, 003, etc.)
          schema:
            type: string
            pattern: '^\d{3}$'
            example: "001"
      responses:
        '200':
          description: Envío encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvioSpec'
              example:
                id: "001"
                cliente: "Juan Pérez"
                direccion: "Calle 12 #45"
                estado: "Entregado"
        '404':
          description: Envío no encontrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Envío no encontrado"
        '500':
          description: Error interno del servidor

components:
  schemas:
    EnvioSpec:
      type: object
      description: |
        Estructura JSON estandarizada según especificación técnica.
        Corresponde a la transformación de los datos CSV: id_envio,cliente,direccion,estado
      required:
        - id
        - cliente
        - direccion
        - estado
      properties:
        id:
          type: string
          description: ID único del envío (formato numérico con ceros a la izquierda)
          pattern: '^\d{3}$'
          example: "001"
        cliente:
          type: string
          description: Nombre completo del cliente
          minLength: 3
          maxLength: 100
          example: "Juan Pérez"
        direccion:
          type: string
          description: Dirección completa de entrega
          minLength: 5
          maxLength: 200
          example: "Calle 12 #45"
        estado:
          type: string
          description: Estado actual del envío
          enum: ["Entregado", "En tránsito", "Pendiente"]
          example: "Entregado"

    EnvioSpecRequest:
      type: object
      description: Datos requeridos para registrar un nuevo envío
      required:
        - cliente
        - direccion
        - estado
      properties:
        id:
          type: string
          description: ID opcional del envío (se genera automáticamente si se omite)
          pattern: '^\d{3}$'
          example: "004"
        cliente:
          type: string
          description: Nombre completo del cliente
          minLength: 3
          maxLength: 100
          example: "Carlos López"
        direccion:
          type: string
          description: Dirección completa de entrega
          minLength: 5
          maxLength: 200
          example: "Carrera 15 #88"
        estado:
          type: string
          description: Estado inicial del envío
          enum: ["Entregado", "En tránsito", "Pendiente"]
          example: "Pendiente"

tags:
  - name: Envíos
    description: |
      Operaciones para gestión de envíos según especificación técnica.
      Implementa patrón File Transfer (CSV → JSON) y API REST.