# Configuración de EcoLogistics Integration System
spring.application.name=ecologistics-integration

# Configuración del servidor según especificación técnica  
server.port=8082

# Deshabilitar auto-configuración del servlet de Camel (lo registramos manualmente)
camel.component.servlet.mapping.enabled=false

# Hace que Camel quede corriendo bajo Spring Boot
camel.main.run-controller=true

# Configuración de logging
logging.level.org.apache.camel=INFO
logging.level.com.ecologistics.integration=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Configuración de Camel
camel.main.name=EcoLogisticsIntegration
camel.main.duration-max-messages=0
camel.main.shutdown-timeout=60

# Configuración REST API
camel.rest.component=servlet
camel.rest.binding-mode=json
camel.rest.data-format-property.prettyPrint=true
camel.rest.context-path=/api
camel.rest.api-context-path=/api-doc

# Configuración OpenAPI para EcoLogistics
camel.rest.api-property.api.title=EcoLogistics API
camel.rest.api-property.api.version=1.0.0
camel.rest.api-property.api.description=Sistema de integración para gestión de envíos y vehículos - EcoLogistics S.A.
camel.rest.api-property.cors=true

# Configuración específica de EcoLogistics
file.input.path=input
file.output.path=output
file.archive.path=archived

# Configuración de la empresa
company.name=EcoLogistics S.A.
company.description=Empresa de transporte y distribución
